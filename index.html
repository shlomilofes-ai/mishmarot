const HEB_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

/* =========================================================
   פונקציות עזר - תאריכים
   ========================================================= */
const pad = n => String(n).padStart(2, '0');
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const todayKey = () => toKey(new Date());
const addDays = (key, n) => {
  const d = fromKey(key);
  d.setDate(d.getDate() + n);
  return toKey(d);
};
const bookingKey = (dateKey, shiftId) => `${dateKey}|${shiftId}`;
function formatLongDate(key) {
  const d = fromKey(key);
  return `יום ${HEB_DAYS_FULL[d.getDay()]}, ${d.getDate()} ב${HEB_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function formatShortDate(key) {
  const d = fromKey(key);
  return `${HEB_DAYS_SHORT[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`;
}
function hebrewCalendarDate(key) {
  try {
    return new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {
      day: 'numeric',
      month: 'long'
    }).format(fromKey(key));
  } catch (e) {
    return '';
  }
}

/* =========================================================
   פונקציות עזר - טלפון
   ========================================================= */
function normalizePhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('972')) d = '0' + d.slice(3);
  return d;
}
function isValidPhone(p) {
  const d = normalizePhone(p);
  return /^05\d{8}$/.test(d) || /^0[2-9]\d{7}$/.test(d);
}
function formatPhone(p) {
  const d = normalizePhone(p);
  if (d.length === 10) return `${d.slice(0, 3)}-${d.slice(3)}`;
  if (d.length === 9) return `${d.slice(0, 2)}-${d.slice(2)}`;
  return d;
}
function whatsappLink(p, text = '') {
  const d = normalizePhone(p);
  const intl = d.startsWith('0') ? '972' + d.slice(1) : d;
  return `https://wa.me/${intl}${text ? '?text=' + encodeURIComponent(text) : ''}`;
}

}

/* =========================================================
   שכבת נתונים 1: מצב הדגמה (זיכרון הדפדפן בלבד)
   ========================================================= */
function createLocalStore() {
  const load = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        return {
          settings: {
            ...DEFAULT_SETTINGS,
            ...(p.settings || {})
          },
          bookings: p.bookings || {}
        };
      }
    } catch (e) {}
    return {
      settings: {
        ...DEFAULT_SETTINGS
      },
      bookings: {}
    };
  };
  const save = d => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  };
  const listeners = new Set();
  const emit = () => {
    const d = load();
    listeners.forEach(f => f(d));
  };
  window.addEventListener('storage', e => {
    if (e.key === STORAGE_KEY) emit();
  });
  return {
    mode: 'local',
    subscribe(cb, onStatus) {
      listeners.add(cb);
      cb(load());
      onStatus('ready');
      return () => listeners.delete(cb);
    },
    async book(dateKey, shiftId, booking) {
      const d = load();
      const k = bookingKey(dateKey, shiftId);
      if (d.bookings[k]) return {
        ok: false,
        takenBy: d.bookings[k].name
      };
      d.bookings[k] = booking;
      save(d);
      emit();
      return {
        ok: true
      };
    },
    async cancel(dateKey, shiftId, phone) {
      const d = load();
      const k = bookingKey(dateKey, shiftId);
      if (!d.bookings[k]) return {
        ok: true
      };
      if (d.bookings[k].phone !== phone) return {
        ok: false
      };
      delete d.bookings[k];
      save(d);
      emit();
      return {
        ok: true
      };
    },
    async setNote(dateKey, shiftId, phone, note) {
      const d = load();
      const k = bookingKey(dateKey, shiftId);
      if (!d.bookings[k] || d.bookings[k].phone !== phone) return {
        ok: false
      };
      d.bookings[k].note = note;
      save(d);
      emit();
      return {
        ok: true
      };
    },
    async saveSettings(s) {
      const d = load();
      d.settings = {
        ...DEFAULT_SETTINGS,
        ...s
      };
      save(d);
      emit();
    },
    async resetAll() {
      const d = load();
      d.bookings = {};
      save(d);
      emit();
    },
    async importAll(data) {
      save({
        settings: {
          ...DEFAULT_SETTINGS,
          ...(data.settings || {})
        },
        bookings: data.bookings || {}
      });
      emit();
    },
    async exportAll() {
      return load();
    }
  };
}

/* =========================================================
   שכבת נתונים 2: ענן משותף (Firebase Firestore)
   ========================================================= */
function createCloudStore() {
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore();
  const shiftsCol = fs.collection('shifts');
  const settingsRef = fs.collection('config').doc('settings');
  const docId = (dateKey, shiftId) => `${dateKey}_${shiftId}`;
  let state = {
    settings: {
      ...DEFAULT_SETTINGS
    },
    bookings: {}
  };
  const toBookings = snap => {
    const bookings = {};
    snap.forEach(doc => {
      const x = doc.data();
      if (x && x.date && x.shift) {
        bookings[bookingKey(x.date, x.shift)] = {
          name: String(x.name || ''),
          phone: String(x.phone || ''),
          note: String(x.note || ''),
          createdAt: x.createdAt || ''
        };
      }
    });
    return bookings;
  };
  return {
    mode: 'cloud',
    subscribe(cb, onStatus) {
      let gotShifts = false,
        gotSettings = false;
      const check = () => {
        if (gotShifts && gotSettings) {
          clearTimeout(timer);
          onStatus('ready');
        }
      };
      const timer = setTimeout(() => {
        if (!(gotShifts && gotSettings)) onStatus('slow');
      }, 10000);
      const cutoff = addDays(todayKey(), -HISTORY_DAYS);
      const u1 = shiftsCol.where('date', '>=', cutoff).onSnapshot(snap => {
        state = {
          ...state,
          bookings: toBookings(snap)
        };
        gotShifts = true;
        check();
        cb(state);
      }, err => {
        console.error(err);
        clearTimeout(timer);
        onStatus('error');
      });
      const u2 = settingsRef.onSnapshot(doc => {
        state = {
          ...state,
          settings: {
            ...DEFAULT_SETTINGS,
            ...(doc.exists ? doc.data() : {})
          }
        };
        gotSettings = true;
        check();
        cb(state);
      }, err => {
        console.error(err);
        clearTimeout(timer);
        onStatus('error');
      });
      return () => {
        clearTimeout(timer);
        u1();
        u2();
      };
    },
    // תפיסת משמרת בטרנזקציה - אם שניים לוחצים יחד, רק אחד יקבל אותה
    async book(dateKey, shiftId, booking) {
      const ref = shiftsCol.doc(docId(dateKey, shiftId));
      return fs.runTransaction(async t => {
        const s = await t.get(ref);
        if (s.exists) return {
          ok: false,
          takenBy: s.data().name
        };
        t.set(ref, {
          date: dateKey,
          shift: shiftId,
          ...booking
        });
        return {
          ok: true
        };
      });
    },
    async cancel(dateKey, shiftId, phone) {
      const ref = shiftsCol.doc(docId(dateKey, shiftId));
      return fs.runTransaction(async t => {
        const s = await t.get(ref);
        if (!s.exists) return {
          ok: true
        };
        if (s.data().phone !== phone) return {
          ok: false
        };
        t.delete(ref);
        return {
          ok: true
        };
      });
    },
    async setNote(dateKey, shiftId, phone, note) {
      const ref = shiftsCol.doc(docId(dateKey, shiftId));
      return fs.runTransaction(async t => {
        const s = await t.get(ref);
        if (!s.exists || s.data().phone !== phone) return {
          ok: false
        };
        t.update(ref, {
          note
        });
        return {
          ok: true
        };
      });
    },
    async saveSettings(s) {
      await settingsRef.set({
        ...DEFAULT_SETTINGS,
        ...s
      });
    },
    async resetAll() {
      const snap = await shiftsCol.get();
      let batch = fs.batch(),
        n = 0;
      for (const d of snap.docs) {
        batch.delete(d.ref);
        if (++n % 400 === 0) {
          await batch.commit();
          batch = fs.batch();
        }
      }
      await batch.commit();
    },
    async importAll(data) {
      await this.resetAll();
      const entries = Object.entries(data.bookings || {});
      let batch = fs.batch(),
        n = 0;
      for (const [k, b] of entries) {
        const [dateKey, shiftId] = k.split('|');
        if (!dateKey || !shiftId) continue;
        batch.set(shiftsCol.doc(docId(dateKey, shiftId)), {
          date: dateKey,
          shift: shiftId,
          name: String(b.name || ''),
          phone: String(b.phone || ''),
          note: String(b.note || ''),
          createdAt: b.createdAt || new Date().toISOString()
        });
        if (++n % 400 === 0) {
          await batch.commit();
          batch = fs.batch();
        }
      }
      await batch.commit();
      await settingsRef.set({
        ...DEFAULT_SETTINGS,
        ...(data.settings || {})
      });
    },
    async exportAll() {
      const snap = await shiftsCol.get();
      return {
        settings: state.settings,
        bookings: toBookings(snap)
      };
    }
  };
}

/* בחירת שכבת הנתונים */
const CLOUD_CONFIGURED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
let store;
let storeInitError = '';
try {
  if (CLOUD_CONFIGURED) {
    if (typeof firebase === 'undefined') throw new Error('Firebase לא נטען - בדקו חיבור לאינטרנט');

  } else {
    store = createLocalStore();
  }
} catch (e) {
  console.error(e);
  storeInitError = e.message || 'שגיאה בחיבור למסד הנתונים';
  store = createLocalStore();
}
